<html lang="en">

<head>

    /* =========================================================
       GLOBAL RESETS & STYLING
       ========================================================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-dark: #090a0f;
      --card-bg: rgba(18, 20, 29, 0.88);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f0f3f8;
      --text-muted: #8b949e;
      --accent-pink: #ff2d60;
      --accent-cyan: #00f2fe;
      --accent-amber: #ffb703;
      --accent-green: #2ecc71;
      --border-glow: rgba(255, 45, 96, 0.3);
      --font-heading: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'Space Mono', monospace;
    }

    body {
      background-color: var(--bg-dark);
      background-image:
        radial-gradient(ellipse at 20% 20%, rgba(255, 45, 96, 0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(0, 242, 254, 0.08) 0%, transparent 50%);

      font-family: var(--font-heading);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    #root {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem 4rem 1rem;
    }

    /* Section animations */
    .section-container {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.28s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 2.75rem 2.25rem;
      max-width: 620px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7),
        0 0 0 1px rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
      position: relative;
    }

    /* User Top Status Bar */
    .user-top-bar {
      width: 100%;
      max-width: 620px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(18, 20, 29, 0.75);

      border-radius: 12px;

      margin-bottom: 1rem;
      font-family: var(--font-mono);
      font-size: 0.8rem;

      color: var(--text-main);

    .user-top-info strong {

    .user-top-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.75rem;
      font-family: var(--font-mono);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .user-top-btn:hover {
      color: var(--accent-pink);
      border-color: var(--accent-pink);

    /* Typography */

<body>

  <!-- React Mount Root -->
  <div id="root"></div>

  <!-- React Application Component Scripts -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // =========================================================
    // 1. SUPABASE CLIENT CONFIGURATION
    // =========================================================
    const SUPABASE_URL = 'https://plblppbbdvyhnwjulezz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBsYmxwcGJiZHZ5aG53anVsZXp6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0NTU4NjMsImV4cCI6MjEwNDAzMTg2M30.l7ptAHukRTQBURhxuA-AjaUKhb-hS5sIC6Ug08_I1Lw';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // =========================================================
    // 2. HELPER FUNCTIONS: FETCH ONLY REAL USERS FROM DATABASE
    // =========================================================
    async function fetchProfilesFromSupabase(excludeEmail) {
      try {
        let query = supabase.from('profiles').select('*');
        if (excludeEmail) {
          query = query.neq('email', excludeEmail);
        }
        const { data, error } = await query;
        if (error) throw error;
        return data || [];
      } catch (err) {
        console.error('Error fetching real profiles from Supabase:', err);
        return [];
      }
    }

    // =========================================================
    // 3. MAIN REACT APP COMPONENT
    // =========================================================
    function App() {
      // User authentication state
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const saved = localStorage.getItem('last_resort_current_user');
          return saved ? JSON.parse(saved) : null;
        } catch (e) {
          return null;
        }
      });

      // Navigation state
      const [currentSection, setCurrentSection] = useState(() => {
        try {
          const saved = localStorage.getItem('last_resort_current_user');
          return saved ? 'landing' : 'auth';
        } catch (e) {
          return 'auth';
        }
      });

      const [dbStatus, setDbStatus] = useState('Connecting to Supabase...');
      const [syncNotice, setSyncNotice] = useState('');

      // Test Supabase connection on mount
      useEffect(() => {
        async function checkConnection() {
          try {
            const { count, error } = await supabase
              .from('profiles')
              .select('*', { count: 'exact', head: true });
            if (error) {
              setDbStatus('Supabase: Connected');
            } else {
              setDbStatus(`Supabase Live: ${count || 0} registered user${count === 1 ? '' : 's'} in DB`);
            }
          } catch (e) {
            setDbStatus('Supabase: Offline');
          }
        }
        checkConnection();
      }, []);

      // Persist user in localStorage
      const handleUserAuthenticated = (userObj) => {
        setCurrentUser(userObj);
        localStorage.setItem('last_resort_current_user', JSON.stringify(userObj));
        setCurrentSection('landing');
      };

      const handleLogout = () => {
        localStorage.removeItem('last_resort_current_user');
        setCurrentUser(null);
        setCurrentSection('auth');
      };

      // Updates advanced data in Supabase profile as user progresses
      const updateUserData = async (updates, noticeText) => {
        if (!currentUser) return;
        const updated = { ...currentUser, ...updates };
        setCurrentUser(updated);
        localStorage.setItem('last_resort_current_user', JSON.stringify(updated));

        if (noticeText) {
          setSyncNotice(noticeText);
          setTimeout(() => setSyncNotice(''), 3500);
        }

        // Sync with Supabase backend
        try {
          if (currentUser.id) {
            await supabase
              .from('profiles')
              .update(updates)
              .eq('id', currentUser.id);
          } else if (currentUser.email) {
            await supabase
              .from('profiles')
              .update(updates)
              .eq('email', currentUser.email);
          }
        } catch (err) {
          console.error("Failed to update profile in Supabase:", err);
        }
      };

      const navigate = (sectionId) => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
        setCurrentSection(sectionId);
      };

      return (
        <div style={{ width: '100%', display: 'flex', flexDirection: 'column', alignItems: 'center' }}>

          {/* Authenticated User Top Bar */}
          {currentUser && currentSection !== 'auth' && (
            <div className="user-top-bar">
              <div className="user-top-info">
                <span>👤 @{currentUser.username || 'user'}</span>
                <span>({currentUser.name || 'Anonymous'})</span>
                {currentUser.uselessness_score ? (
                  <span style={{ color: 'var(--accent-amber)' }}>| Uselessness: {currentUser.uselessness_score}%</span>
                ) : null}
                {syncNotice && (
                  <span style={{ color: 'var(--accent-cyan)', animation: 'fadeIn 0.2s' }}>⚡ {syncNotice}</span>
                )}
              </div>
              <button className="user-top-btn" onClick={handleLogout}>Log Out</button>
            </div>
          )}

          {/* SCREEN 1: LOGIN / REGISTER ONBOARDING */}
          {currentSection === 'auth' && (
            <AuthSection onAuthenticated={handleUserAuthenticated} />
          )}

          {/* SCREEN 2: LANDING */}
          {currentSection === 'landing' && (
            <LandingSection
              currentUser={currentUser}
              onStart={() => navigate('fate')}
            />
          )}

          {/* SCREEN 3: FATE QUESTION */}
          {currentSection === 'fate' && (
            <FateSection
              onSelectNumber={(number, target) => {
                updateUserData({ favorite_number: parseInt(number, 10) }, `Selected #${number} (Saved to DB)`);
                navigate(target);
              }}
            />
          )}

          {/* SCREEN 4: OPPOSITE MODE */}
          {currentSection === 'opposite' && (
            <OppositeMode
              currentUser={currentUser}
              onSaveData={(oppositeAnswers) => {
                updateUserData({
                  personality: oppositeAnswers.personality,
                  interests: `Prefers: ${oppositeAnswers.weekend}, Communication: ${oppositeAnswers.communication}`,
                  reason_they_are_single: `Emotional maturity: ${oppositeAnswers.emotional_maturity}`
                }, "Opposite preferences saved to Supabase!");
              }}
              onExit={() => navigate('landing')}
            />
          )}

          {/* SCREEN 5: USELESSNESS MATCH MODE */}
          {currentSection === 'useless' && (
            <UselessMode
              currentUser={currentUser}
              onSaveData={(uselessResults) => {
                updateUserData({
                  uselessness_score: uselessResults.score,
                  alarms_per_morning: parseInt(uselessResults.alarms, 10),
                  unread_messages: parseInt(uselessResults.messages, 10),
                  most_useless_skill: "Mosquito squashing reflex"
                }, `Uselessness score (${uselessResults.score}%) saved to Supabase!`);
              }}
              onExit={() => navigate('landing')}
            />
          )}

          {/* PLACEHOLDER MODES */}
          {currentSection === 'slow' && <PlaceholderMode title="SLOW DATING MODE" onExit={() => navigate('landing')} />}
          {currentSection === 'antiswipe' && <PlaceholderMode title="ANTI-SWIPE MODE" onExit={() => navigate('landing')} />}
          {currentSection === 'terrible' && <PlaceholderMode title="WHEEL OF TERRIBLE DECISIONS" onExit={() => navigate('landing')} />}
          {currentSection === 'fatewheel' && <PlaceholderMode title="WHEEL OF FATE" onExit={() => navigate('landing')} />}

          {/* Persistent Supabase Status Footer */}
          <div className="supabase-bar">
            <div className="supabase-dot"></div>
            <span>{dbStatus}</span>
          </div>
        </div>
      );
    }

    // =========================================================
    // SCREEN 1: LOGIN & BASIC ONBOARDING SECTION
    // =========================================================
    function AuthSection({ onAuthenticated }) {
      const [authMode, setAuthMode] = useState('register'); // 'register' | 'login'
      const [loading, setLoading] = useState(false);
      const [alertMsg, setAlertMsg] = useState({ text: '', type: '' });

      // Registration & Basic Data Form state
      const [formData, setFormData] = useState({
        username: '',
        email: '',
        password: '',
        name: '',
        age: '24',
        gender: 'Not specified',
        location: 'Earth',
        bio: 'Ready to hit rock bottom in modern romance.'
      });

      // Login form state
      const [loginIdent, setLoginIdent] = useState('');
      const [loginPass, setLoginPass] = useState('');

      const handleFormChange = (field, val) => {
        setFormData(prev => ({ ...prev, [field]: val }));
      };

      // Register new user with Supabase Auth and insert profile into Supabase `profiles`
      const handleRegister = async (e) => {
        e.preventDefault();
        setAlertMsg({ text: '', type: '' });

        if (!formData.username.trim() || !formData.email.trim() || !formData.password.trim()) {
          setAlertMsg({ text: 'Username, Email and Password are required.', type: 'error' });
          return;
        }

        setLoading(true);

        const email = formData.email.trim().toLowerCase();
        const username = formData.username.trim().toLowerCase();
        const password = formData.password;

        try {
          // 1. Sign up with Supabase Auth (passing profile metadata to raw_user_meta_data)
          const { data: authData, error: authErr } = await supabase.auth.signUp({
            email: email,
            password: password,
            options: {
              data: {
                username: username,
                name: formData.name.trim() || username,
                age: parseInt(formData.age, 10) || 24,
                gender: formData.gender,
                location: formData.location.trim() || 'Undisclosed',
                bio: formData.bio.trim()
              }
            }
          });

          if (authErr) throw authErr;

          const userId = authData.user?.id;
          if (!userId) throw new Error('Registration failed: no user ID returned.');

          // 2. Client-side upsert into `profiles` table
          const newProfile = {
            id: userId,
            username: username,
            email: email,
            name: formData.name.trim() || username,
            age: parseInt(formData.age, 10) || 24,
            gender: formData.gender,
            location: formData.location.trim() || 'Undisclosed',
            bio: formData.bio.trim(),
            uselessness_score: 0,
            favorite_number: 7
          };

          let createdUser = newProfile;
          try {
            const { data: upsertData } = await supabase
              .from('profiles')
              .upsert([newProfile])
              .select();

            if (upsertData && upsertData[0]) {
              createdUser = upsertData[0];
            }
          } catch (upsertErr) {
            console.warn("Client upsert notice (handled by DB trigger):", upsertErr);
          }

          // 3. Ensure active session
          await supabase.auth.signInWithPassword({ email, password }).catch(() => {});

          const createdUser = (data && data[0]) ? data[0] : newProfile;
          setAlertMsg({ text: 'Account created! Entering Last Resort...', type: 'success' });
          setTimeout(() => {
            onAuthenticated(createdUser);
          }, 800);
        } catch (err) {
          console.error("Registration error:", err);
          setAlertMsg({ text: err.message || 'Error connecting to database.', type: 'error' });
        } finally {
          setLoading(false);
        }
      };

      // Login user via Supabase Auth
      const handleLogin = async (e) => {
        e.preventDefault();
        setAlertMsg({ text: '', type: '' });

        if (!loginIdent.trim() || !loginPass.trim()) {
          setAlertMsg({ text: 'Please enter your username/email and password.', type: 'error' });
          return;
        }

        setLoading(true);
        const ident = loginIdent.trim().toLowerCase();

        try {
          let userEmail = ident;

          // If user entered username instead of email, resolve email from profiles
          if (!ident.includes('@')) {
            const { data: profData, error: profErr } = await supabase
              .from('profiles')
              .select('email')
              .eq('username', ident)
              .maybeSingle();

            if (profErr || !profData) {
              throw new Error('No account found with this username.');
            }
            userEmail = profData.email;
          }

          // Sign in with Supabase Auth
          const { data: authData, error: authErr } = await supabase.auth.signInWithPassword({
            email: userEmail,
            password: loginPass
          });

          if (authErr) throw authErr;

          // Fetch profile details
          const { data: userProfiles, error: fetchErr } = await supabase
            .from('profiles')
            .select('*')
            .eq('id', authData.user.id)
            .maybeSingle();

          const user = userProfiles || { id: authData.user.id, email: userEmail, username: ident };

          setAlertMsg({ text: `Welcome back, ${user.name || user.username || 'user'}!`, type: 'success' });
          setTimeout(() => {
            onAuthenticated(user);
          }, 700);
        } catch (err) {
          console.error("Login error:", err);
          setAlertMsg({ text: err.message || 'Login failed. Please check credentials.', type: 'error' });
        } finally {
          setLoading(false);
        }
      };

      return (
        <section className="section-container">
          <div className="card">
            <h1 className="brand-title">LAST RESORT<span className="brand-gradient">™</span></h1>
            <p className="tagline">Sign in or create your profile to join the database.</p>

            {/* Auth Mode Tabs */}
            <div className="auth-tabs">
              <button
                type="button"
                className={`auth-tab-btn ${authMode === 'register' ? 'active' : ''}`}
                onClick={() => { setAuthMode('register'); setAlertMsg({ text: '', type: '' }); }}
              >
                Create Profile
              </button>
              <button
                type="button"
                className={`auth-tab-btn ${authMode === 'login' ? 'active' : ''}`}
                onClick={() => { setAuthMode('login'); setAlertMsg({ text: '', type: '' }); }}
              >
                Existing User Log In
              </button>
            </div>

            {/* Feedback alert */}
            {alertMsg.text && (
              <div className={`auth-alert ${alertMsg.type}`}>{alertMsg.text}</div>
            )}

            {/* TAB 1: REGISTRATION & BASIC DATA COLLECTION */}
            {authMode === 'register' && (
              <form className="auth-form" onSubmit={handleRegister}>
                <div style={{ display: 'flex', flexDirection: 'column', gap: '0.75rem' }}>
                  <p style={{ fontSize: '0.8rem', color: 'var(--accent-pink)', fontFamily: 'var(--font-mono)' }}>
                    // 1. CREDENTIALS
                  </p>

                  <div className="form-row">
                    <div className="form-group">
                      <label className="form-label">Username *</label>
                      <input
                        type="text"
                        required
                        className="form-input"
                        placeholder="e.g. hopeless_romantic"
                        value={formData.username}
                        onChange={(e) => handleFormChange('username', e.target.value)}
                      />
                    </div>

                    <div className="form-group">
                      <label className="form-label">Email *</label>
                      <input
                        type="email"
                        required
                        className="form-input"
                        placeholder="you@email.com"
                        value={formData.email}
                        onChange={(e) => handleFormChange('email', e.target.value)}
                      />
                    </div>
                  </div>

                  <div className="form-group">
                    <label className="form-label">Password *</label>
                    <input
                      type="password"
                      required
                      className="form-input"
                      placeholder="••••••••"
                      value={formData.password}
                      onChange={(e) => handleFormChange('password', e.target.value)}
                    />
                  </div>

                  <p style={{ fontSize: '0.8rem', color: 'var(--accent-cyan)', fontFamily: 'var(--font-mono)', marginTop: '0.5rem' }}>
                    // 2. BASIC PROFILE DATA
                  </p>

                  <div className="form-row">
                    <div className="form-group">
                      <label className="form-label">Display Name</label>
                      <input
                        type="text"
                        className="form-input"
                        placeholder="e.g. Alex"
                        value={formData.name}
                        onChange={(e) => handleFormChange('name', e.target.value)}
                      />
                    </div>

                    <div className="form-group">
                      <label className="form-label">Age</label>
                      <input
                        type="number"
                        min="18"
                        max="99"
                        className="form-input"
                        value={formData.age}
                        onChange={(e) => handleFormChange('age', e.target.value)}
                      />
                    </div>
                  </div>

                  <div className="form-row">
                    <div className="form-group">
                      <label className="form-label">Gender</label>
                      <select
                        className="form-input"
                        value={formData.gender}
                        onChange={(e) => handleFormChange('gender', e.target.value)}
                      >
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Non-Binary">Non-Binary</option>
                        <option value="Other">Other</option>
                        <option value="Prefer not to say">Prefer not to say</option>
                      </select>
                    </div>

                    <div className="form-group">
                      <label className="form-label">Location / City</label>
                      <input
                        type="text"
                        className="form-input"
                        placeholder="e.g. New York, NY"
                        value={formData.location}
                        onChange={(e) => handleFormChange('location', e.target.value)}
                      />
                    </div>
                  </div>

                  <div className="form-group">
                    <label className="form-label">Initial Dating Bio</label>
                    <input
                      type="text"
                      className="form-input"
                      placeholder="A short summary of your current low standards..."
                      value={formData.bio}
                      onChange={(e) => handleFormChange('bio', e.target.value)}
                    />
                  </div>
                </div>

                <button type="submit" className="btn-primary" disabled={loading} style={{ marginTop: '0.5rem' }}>
                  {loading ? 'CONNECTING TO SUPABASE...' : 'JOIN & PROCEED TO DATING APP'}
                </button>
              </form>
            )}

            {/* TAB 2: LOGIN */}
            {authMode === 'login' && (
              <form className="auth-form" onSubmit={handleLogin}>
                <div className="form-group">
                  <label className="form-label">Username or Email</label>
                  <input
                    type="text"
                    required
                    className="form-input"
                    placeholder="Enter your email or username"
                    value={loginIdent}
                    onChange={(e) => setLoginIdent(e.target.value)}
                  />
                </div>

                <div className="form-group">
                  <label className="form-label">Password</label>
                  <input
                    type="password"
                    required
                    className="form-input"
                    placeholder="••••••••"
                    value={loginPass}
                    onChange={(e) => setLoginPass(e.target.value)}
                  />
                </div>

                <button type="submit" className="btn-primary" disabled={loading} style={{ marginTop: '0.75rem' }}>
                  {loading ? 'VERIFYING CREDENTIALS...' : 'LOG IN & RETRIEVE PROFILE'}
                </button>
              </form>
            )}

          </div>
        </section>
      );
    }

    // =========================================================
    // SCREEN 2: LANDING (DISPLAY EXACT TEXT)
    // =========================================================
    function LandingSection({ currentUser, onStart }) {
      return (
        <section id="landing" className="section-container">
          <div className="card">
            <h1 className="brand-title">Welcome to <span className="brand-gradient">LAST RESORT™</span></h1>
            {currentUser && (
              <p style={{ color: 'var(--accent-cyan)', fontSize: '0.95rem', fontWeight: 600 }}>
                Logged in as {currentUser.name || currentUser.username}

            <p className="tagline">The dating app you use when every other option has failed.</p>
            <p className="rock-bottom">You have officially hit rock bottom.</p>
            <p className="risk-warning">Enter at your own risk</p>

            <button className="btn-primary" onClick={onStart}>FIND ME SOMEONE</button>

    // =========================================================
    // SCREEN 3: FATE QUESTION
    // =========================================================
    function FateSection({ onSelectNumber }) {
      const routes = {
        '7': 'opposite',
        '27': 'slow',
        '11': 'useless',

        '99': 'terrible',

    // =========================================================
    // MODE 1: THE OPPOSITE MODE (CONNECTED TO SUPABASE)
    // =========================================================
    function OppositeMode({ currentUser, onSaveData, onExit }) {
      const [stage, setStage] = useState('questions'); // 'questions' | 'analyzing' | 'result'
      const [analyzingText, setAnalyzingText] = useState('Analyzing your type...');
      const [matchedProfile, setMatchedProfile] = useState(null);
      const [fromDatabase, setFromDatabase] = useState(false);

      const [formData, setFormData] = useState({
        personality: 'Introvert',
        communication: 'Text constantly',
        weekend: 'Stay home',
        emotional_maturity: 'Very mature'
      });

      const handleOptionChange = (field, value) => {
        setFormData(prev => ({ ...prev, [field]: value }));
      };

      const handleSubmit = async (e) => {
        e.preventDefault();

        // Save advanced preferences to Supabase along the way
        if (onSaveData) {
          onSaveData(formData);
        }

        setStage('analyzing');
        setAnalyzingText('Analyzing your type...');

        // 2 seconds later -> second text
        setTimeout(() => {
          setAnalyzingText('We know exactly who NOT to show you.');

          // Match generation via Supabase (Real users only)
          setTimeout(async () => {
            const profiles = await fetchProfilesFromSupabase(currentUser?.email);
            if (profiles && profiles.length > 0) {
              const oppositePool = profiles.filter(p => p.personality && p.personality !== formData.personality);
              const pool = oppositePool.length > 0 ? oppositePool : profiles;
              const picked = pool[Math.floor(Math.random() * pool.length)];
              setMatchedProfile(picked);
            } else {
              setMatchedProfile('NO_USERS');
            }
            setStage('result');
          }, 1400);
        }, 2000);
      };

      const handleTryAgain = () => {
        setFormData({
          personality: 'Introvert',
          communication: 'Text constantly',
          weekend: 'Stay home',
          emotional_maturity: 'Very mature'
        });
        setStage('questions');
      };

      return (
        <section id="opposite" className="section-container">
          <div className="card">
            <h2 className="heading-large">THE OPPOSITE MODE</h2>

            {/* STAGE 1: QUESTIONS FORM */}
            {stage === 'questions' && (
              <div className="questions-container">
                <p className="mode-subtitle" style={{ textAlign: 'center' }}>
                  Tell us your preferences so we can find your absolute nightmare.
                </p>
                <form onSubmit={handleSubmit} style={{ display: 'flex', flexDirection: 'column', gap: '1.25rem', width: '100%' }}>

                  {/* Q1 */}

                    <span className="q-title">1. Personality</span>
                    <div className="options-grid">
                      {['Introvert', 'Extrovert', 'Calm', 'Chaotic'].map(opt => (
                        <label key={opt} className={`radio-label ${formData.personality === opt ? 'selected' : ''}`}>
                          <input type="radio" name="personality" checked={formData.personality === opt} onChange={() => handleOptionChange('personality', opt)} />
                          <span className="radio-text">{opt}</span>
                        </label>
                      ))}
                    </div>
                  </div>

                  {/* Q2 */}
                  <div className="q-group">
                    <span className="q-title">2. Communication</span>
                    <div className="options-grid">
                      {['Text constantly', 'Replies late', 'Calls randomly', 'Sends memes'].map(opt => (
                        <label key={opt} className={`radio-label ${formData.communication === opt ? 'selected' : ''}`}>
                          <input type="radio" name="communication" checked={formData.communication === opt} onChange={() => handleOptionChange('communication', opt)} />
                          <span className="radio-text">{opt}</span>
                        </label>
                      ))}
                    </div>
                  </div>

                  {/* Q3 */}
                  <div className="q-group">
                    <span className="q-title">3. Weekend</span>
                    <div className="options-grid">
                      {['Stay home', 'Party', 'Travel', 'Sleep'].map(opt => (
                        <label key={opt} className={`radio-label ${formData.weekend === opt ? 'selected' : ''}`}>
                          <input type="radio" name="weekend" checked={formData.weekend === opt} onChange={() => handleOptionChange('weekend', opt)} />
                          <span className="radio-text">{opt}</span>
                        </label>
                      ))}
                    </div>
                  </div>

                  {/* Q4 */}
                  <div className="q-group">
                    <span className="q-title">4. Emotional maturity</span>
                    <div className="options-grid">
                      {['Very mature', 'Normal', "Doesn't matter", 'No idea'].map(opt => (
                        <label key={opt} className={`radio-label ${formData.emotional_maturity === opt ? 'selected' : ''}`}>
                          <input type="radio" name="emotional_maturity" checked={formData.emotional_maturity === opt} onChange={() => handleOptionChange('emotional_maturity', opt)} />
                          <span className="radio-text">{opt}</span>
                        </label>
                      ))}
                    </div>
                  </div>

                  <div className="button-group" style={{ marginTop: '0.5rem' }}>
                    <button type="submit" className="btn-primary">SUBMIT</button>
                    <button type="button" className="btn-exit" onClick={onExit}>EXIT</button>
                  </div>
                </form>
              </div>
            )}

            {/* STAGE 2: ANALYZING SCREEN */}
            {stage === 'analyzing' && (
              <div className="analyzing-box">
                <div className="analyzing-spinner"></div>
                <p className="analyzing-text">{analyzingText}</p>
              </div>
            )}

            {/* STAGE 3: MATCH RESULT */}
            {stage === 'result' && (
              matchedProfile === 'NO_USERS' ? (
                <div className="match-box">
                  <div className="match-header" style={{ color: 'var(--accent-amber)' }}>NO MATCHES IN DATABASE YET 💔</div>
                  <div className="match-profile-card" style={{ textAlign: 'center' }}>
                    <h3 className="match-name-age">You're Currently the Only Registered Soul</h3>
                    <p className="match-bio-text" style={{ marginTop: '0.6rem' }}>
                      There are currently no other user accounts in your Supabase database.
                      Have someone else register an account (or create a second profile with another username/email) to match with real database users!

                  <div className="button-group">
                    <button type="button" className="btn-primary" onClick={handleTryAgain}>TRY AGAIN</button>
                    <button type="button" className="btn-exit" onClick={onExit}>EXIT</button>
                  </div>
                </div>
              ) : matchedProfile && (
                <div className="match-box">
                  <div className="match-header">MATCH FOUND ❤️</div>
                  <div className="match-profile-card">
                    <div className="match-profile-header">
                      <h3 className="match-name-age">{matchedProfile.name || matchedProfile.username}, {matchedProfile.age || 'Age Unknown'}</h3>
                      <span className="match-personality-badge">{matchedProfile.personality || 'Real User'}</span>
                    </div>
                    <p className="match-bio-text">{matchedProfile.bio || 'No bio provided yet.'}</p>
                    {matchedProfile.location && (
                      <p style={{ fontSize: '0.85rem', color: 'var(--text-muted)' }}>📍 Location: {matchedProfile.location}</p>
                    )}
                    {matchedProfile.red_flag && (
                      <p style={{ fontSize: '0.85rem', color: '#ff758c' }}>🚩 <strong>Red Flag:</strong> {matchedProfile.red_flag}</p>
                    )}
                    <span className="db-badge">
                      ⚡ Real User from Supabase: @{matchedProfile.username}
                    </span>
                  </div>

                  <div className="compatibility-banner">
                    93% OPPOSITE COMPATIBILITY
                  </div>

                  <div className="button-group">
                    <button type="button" className="btn-primary" onClick={handleTryAgain}>TRY AGAIN</button>
                    <button type="button" className="btn-exit" onClick={onExit}>EXIT</button>
                  </div>
                </div>
              )
            )}

          </div>
        </section>
      );
    }

    // =========================================================
    // MODE 3: USELESSNESS MATCH MODE (CONNECTED TO SUPABASE)
    // =========================================================
    function UselessMode({ currentUser, onSaveData, onExit }) {
      const [step, setStep] = useState(1); // 1: Volume, 2: Mosquito, 3: Questions, 4: Result
      const [volume, setVolume] = useState(0);
      const [volumeFeedback, setVolumeFeedback] = useState('(Click repeatedly to force volume output)');

      // Mosquito states
      const [mosquitoPos, setMosquitoPos] = useState({ top: '50%', left: '50%' });
      const [mosquitoSquashed, setMosquitoSquashed] = useState(false);
      const [mosquitoStatus, setMosquitoStatus] = useState('Catch the mosquito!');

      // Question states
      const [alarms, setAlarms] = useState('0');
      const [fridge, setFridge] = useState('0');
      const [messages, setMessages] = useState('0');

      // Result states
      const [finalScore, setFinalScore] = useState(94);
      const [matchedProfile, setMatchedProfile] = useState(null);
      const [fromDatabase, setFromDatabase] = useState(false);

      const arenaRef = useRef(null);
      const intervalRef = useRef(null);

      // Step 1: Volume Chaos
      const handleScream = () => {
        setVolume(prev => {
          const next = Math.min(100, prev + 25);
          if (next === 25) setVolumeFeedback('A pathetic squeak... SCREAM LOUDER!');
          else if (next === 50) setVolumeFeedback('Moderate screech detected! KEEP YELLING!');
          else if (next === 75) setVolumeFeedback('Neighbors are reaching for the phone!');
          else if (next >= 100) {
            setVolumeFeedback('MAXIMUM CHAOS! Ear drums successfully shattered.');
            setTimeout(() => {
              setStep(2);
            }, 800);
          }
          return next;
        });
      };

      // Step 2: Mosquito movement loop
      useEffect(() => {
        if (step === 2 && !mosquitoSquashed) {
          intervalRef.current = setInterval(() => {
            const maxX = 360;
            const maxY = 160;
            const randX = Math.floor(Math.random() * maxX);
            const randY = Math.floor(Math.random() * maxY);
            setMosquitoPos({ top: `${randY}px`, left: `${randX}px` });
          }, 500);
        }
        return () => clearInterval(intervalRef.current);
      }, [step, mosquitoSquashed]);

      const handleSquashMosquito = () => {
        if (mosquitoSquashed) return;
        clearInterval(intervalRef.current);
        setMosquitoSquashed(true);
        setMosquitoStatus('Target eliminated.');

        setTimeout(() => {
          setStep(3);
        }, 1100);
      };

      // Step 3: Questions & Calculate Uselessness Score + Supabase Match
      const handleCalculate = async (e) => {
        e.preventDefault();
        const score = Math.min(99, 82 + Math.floor(Math.random() * 17));
        setFinalScore(score);

        // Save advanced uselessness metrics to Supabase along the way
        if (onSaveData) {
          onSaveData({ score, alarms, fridge, messages });
        }

        const profiles = await fetchProfilesFromSupabase(currentUser?.email);
        if (profiles && profiles.length > 0) {
          const picked = profiles[Math.floor(Math.random() * profiles.length)];
          setMatchedProfile(picked);
        } else {
          setMatchedProfile('NO_USERS');
        }
        setStep(4);
      };

      const handleTryAgain = () => {
        setVolume(0);
        setVolumeFeedback('(Click repeatedly to force volume output)');
        setMosquitoSquashed(false);
        setMosquitoStatus('Catch the mosquito!');
        setMosquitoPos({ top: '50%', left: '50%' });
        setAlarms('0');
        setFridge('0');
        setMessages('0');
        setStep(1);
      };

      return (
        <section id="useless" className="section-container">
          <div className="card">
            <h2 className="heading-large">USELESSNESS MATCH MODE</h2>

            {/* STEP 1: VOLUME CHAOS */}
            {step === 1 && (
              <div className="useless-step-box">
                <p className="mode-subtitle">Step 1 — Volume Chaos</p>
                <p style={{ fontSize: '1.25rem', fontWeight: 600, color: 'var(--text-main)' }}>"Play this audio"</p>

                <div className="volume-meter-track">
                  <div className="volume-meter-fill" style={{ width: `${volume}%` }}></div>
                </div>
                <p className="volume-meter-label">Volume: {volume}%</p>
                <p className="tagline" style={{ minHeight: '1.5rem', fontSize: '0.9rem' }}>{volumeFeedback}</p>

                <div className="button-group">
                  <button type="button" className="btn-primary" onClick={handleScream} disabled={volume >= 100}>
                    {volume >= 100 ? 'MAX VOLUME REACHED' : 'SCREAM TO INCREASE VOLUME'}
                  </button>
                  <button type="button" className="btn-exit" onClick={onExit}>EXIT</button>
                </div>
              </div>
            )}

            {/* STEP 2: MOSQUITO GAME */}
            {step === 2 && (
              <div className="useless-step-box">
                <p className="mode-subtitle">Step 2 — Mosquito Game</p>
                <p style={{ fontSize: '1.05rem', color: 'var(--text-main)' }}>
                  Eliminate the buzzing intruder to test your useless patience:
                </p>

                <div ref={arenaRef} className="mosquito-arena">
                  <div
                    className={`mosquito ${mosquitoSquashed ? 'squashed' : ''}`}
                    style={{ top: mosquitoPos.top, left: mosquitoPos.left }}
                    onClick={handleSquashMosquito}
                  >
                    {mosquitoSquashed ? '💥' : '🦟'}
                  </div>
                </div>

                <p className="mosquito-status">{mosquitoStatus}</p>
                <div className="button-group">
                  <button type="button" className="btn-exit" onClick={onExit}>EXIT</button>
                </div>
              </div>
            )}

            {/* STEP 3: QUESTIONS */}
            {step === 3 && (
              <div className="useless-step-box">
                <p className="mode-subtitle">Step 3 — Questions</p>
                <form onSubmit={handleCalculate} style={{ display: 'flex', flexDirection: 'column', gap: '1.25rem', width: '100%', textAlign: 'left' }}>

                  <div className="q-group">
                    <span className="q-title">1. How many alarms do you snooze?</span>
                    <div className="options-grid">
                      {[['0', 'None (liar)'], ['5', '1–3 alarms'], ['15', '4–7 alarms'], ['30', '12+ (until regret)']].map(([val, label]) => (
                        <label key={val} className={`radio-label ${alarms === val ? 'selected' : ''}`}>
                          <input type="radio" name="alarms" checked={alarms === val} onChange={() => setAlarms(val)} />
                          <span className="radio-text">{label}</span>
                        </label>
                      ))}
                    </div>
                  </div>

                  <div className="q-group">
                    <span className="q-title">2. How often do you open the fridge randomly?</span>
                    <div className="options-grid">
                      {[['0', 'Only when hungry'], ['10', 'Every 20 mins'], ['20', 'Hoping new food spawned'], ['30', 'I live in the fridge']].map(([val, label]) => (
                        <label key={val} className={`radio-label ${fridge === val ? 'selected' : ''}`}>
                          <input type="radio" name="fridge" checked={fridge === val} onChange={() => setFridge(val)} />
                          <span className="radio-text">{label}</span>
                        </label>
                      ))}
                    </div>
                  </div>

                  <div className="q-group">
                    <span className="q-title">3. How many unread messages?</span>
                    <div className="options-grid">
                      {[['0', '0 (Inbox zero robot)'], ['10', '5–50 unread'], ['25', '999+ red dots'], ['35', 'Phone is a brick']].map(([val, label]) => (
                        <label key={val} className={`radio-label ${messages === val ? 'selected' : ''}`}>
                          <input type="radio" name="messages" checked={messages === val} onChange={() => setMessages(val)} />
                          <span className="radio-text">{label}</span>
                        </label>
                      ))}
                    </div>
                  </div>

                  <div className="button-group" style={{ marginTop: '0.5rem' }}>
                    <button type="submit" className="btn-primary">CALCULATE USELESSNESS</button>
                    <button type="button" className="btn-exit" onClick={onExit}>EXIT</button>
                  </div>
                </form>
              </div>
            )}

            {/* STEP 4: RESULT */}
            {step === 4 && (
              matchedProfile === 'NO_USERS' ? (
                <div className="match-box">
                  <div className="match-header" style={{ color: 'var(--accent-amber)' }}>NO OTHER USERS FOUND 🦥</div>
                  <div className="compatibility-banner" style={{ fontSize: '1.25rem' }}>
                    YOUR USELESSNESS SCORE: {finalScore}%
                  </div>
                  <div className="match-profile-card" style={{ textAlign: 'center' }}>
                    <h3 className="match-name-age">Solo Sloth Mode</h3>
                    <p className="match-bio-text" style={{ marginTop: '0.6rem' }}>
                      There are no other profiles in your Supabase database yet.
                      Once another user registers and takes the test, you will be matched with them here!
                    </p>
                  </div>
                  <p className="waste-time-banner">
                    Until then, you are free to waste 11.7 hours alone.
                  </p>
                  <div className="button-group">
                    <button type="button" className="btn-primary" onClick={handleTryAgain}>TRY AGAIN</button>
                    <button type="button" className="btn-exit" onClick={onExit}>EXIT</button>
                  </div>
                </div>
              ) : matchedProfile && (
                <div className="match-box">
                  <div className="match-header" style={{ color: 'var(--accent-amber)' }}>MATCH FOUND 🦥</div>

                  <div className="compatibility-banner" style={{ fontSize: '1.25rem' }}>
                    YOUR USELESSNESS SCORE: {finalScore}%
                  </div>

                  <div className="match-profile-card">
                    <div className="match-profile-header">
                      <h3 className="match-name-age">{matchedProfile.name || matchedProfile.username}, {matchedProfile.age || 'Age Unknown'}</h3>
                      <span className="match-personality-badge">{matchedProfile.personality || 'Fellow Sloth'}</span>
                    </div>
                    <p className="match-bio-text">{matchedProfile.bio || 'No bio provided.'}</p>
                    {matchedProfile.location && (
                      <p style={{ fontSize: '0.85rem', color: 'var(--text-muted)' }}>📍 Location: {matchedProfile.location}</p>
                    )}
                    {matchedProfile.uselessness_score ? (
                      <p style={{ fontSize: '0.85rem', color: 'var(--accent-amber)' }}>
                        💤 Partner Uselessness Score: {matchedProfile.uselessness_score}%
                      </p>
                    ) : null}
                    <span className="db-badge">
                      ⚡ Real User from Supabase: @{matchedProfile.username}
                    </span>
                  </div>

                  <p className="waste-time-banner">
                    Together, you could waste 11.7 hours per day.
                  </p>

                  <div className="button-group">
                    <button type="button" className="btn-primary" onClick={handleTryAgain}>TRY AGAIN</button>
                    <button type="button" className="btn-exit" onClick={onExit}>EXIT</button>
                  </div>
                </div>
              )
            )}

          </div>
        </section>
      );
    }

    // =========================================================
    // PLACEHOLDER MODES (SLOW, ANTI-SWIPE, TERRIBLE, FATEWHEEL)
    // =========================================================
    function PlaceholderMode({ title, onExit }) {
      return (
        <section className="section-container">
          <div className="card">
            <h2 className="heading-large">{title}</h2>
            <button className="btn-exit" onClick={onExit}>EXIT</button>
          </div>
        </section>
      );
    }

    // Render the React application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
